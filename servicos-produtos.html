<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Serviços e estoque · InovaMente</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head>
<body><header id="nav"></header><main class="container"><div class=""><p class="eyebrow">InovaMente / seu salão, organizado</p><h1>Serviços e estoque</h1><p class="subtitle">Seu catálogo e seus insumos sob controle.</p><div id="notice" class="d-none" role="alert" aria-live="polite"></div><ul class="nav nav-tabs" role="tablist"><li class="nav-item" role="presentation"><button class="nav-link active" id="services-tab" data-bs-toggle="tab" data-bs-target="#services" type="button" role="tab" aria-controls="services" aria-selected="true">Serviços</button></li><li class="nav-item" role="presentation"><button class="nav-link " id="products-tab" data-bs-toggle="tab" data-bs-target="#products" type="button" role="tab" aria-controls="products" aria-selected="false">Produtos e insumos</button></li></ul><div class="tab-content"><section class="tab-pane fade show active" id="services" role="tabpanel" aria-labelledby="services-tab"><button class="btn btn-primary mt-3" type="button" id="new-service">Novo serviço</button><div id="services-list" class="panel mt-3"></div></section><section class="tab-pane fade " id="products" role="tabpanel" aria-labelledby="products-tab"><button class="btn btn-primary mt-3" type="button" id="new-product">Novo produto</button><div id="products-list" class="panel mt-3"></div></section></div><div class="modal fade" id="service-modal" tabindex="-1" aria-labelledby="service-modal-title" aria-hidden="true"><div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h2 class="modal-title fs-5" id="service-modal-title">Serviço</h2><button class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button></div><div class="modal-body"><form id="service-form"><input type="hidden" id="service-id"><label class="form-label" for="title">Título</label><input class="form-control" id="title" type="text" required name="title"><label class="form-label" for="service-description">Descrição</label><input class="form-control" id="service-description" type="text"  name="description"><label class="form-label" for="price">Preço (R$)</label><input class="form-control" id="price" type="number" required min="0" step="0.01" name="price"><label class="form-label" for="duration">Duração (minutos)</label><input class="form-control" id="duration" type="number" required min="1" step="1" name="duration_minutes"><label class="d-block mt-3"><input type="checkbox" id="is_active" name="is_active" checked> Serviço ativo</label><div class="text-end"><button class="btn btn-primary mt-3" type="submit" >Salvar</button></div></form></div></div></div></div><div class="modal fade" id="product-modal" tabindex="-1" aria-labelledby="product-modal-title" aria-hidden="true"><div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h2 class="modal-title fs-5" id="product-modal-title">Produto</h2><button class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button></div><div class="modal-body"><form id="product-form"><input type="hidden" id="product-id"><label class="form-label" for="product-name">Nome</label><input class="form-control" id="product-name" type="text" required name="name"><label class="form-label" for="category">Categoria</label><input class="form-control" id="category" type="text"  name="category"><label class="form-label" for="cost">Preço de custo (R$)</label><input class="form-control" id="cost" type="number" required min="0" step="0.01" name="cost_price"><label class="form-label" for="sale-price">Preço de venda (R$)</label><input class="form-control" id="sale-price" type="number" required min="0" step="0.01" name="sale_price"><label class="form-label" for="minimum">Estoque mínimo</label><input class="form-control" id="minimum" type="number" required min="0" step="1" name="min_stock_level"><p class="text-secondary mt-3">Produtos novos começam com estoque zero. Use Ajustar estoque para registrar a entrada inicial.</p><label><input type="checkbox" id="internal" name="is_internal_use_only"> Uso interno exclusivo</label><div class="text-end"><button class="btn btn-primary mt-3" type="submit" >Salvar</button></div></form></div></div></div></div><div class="modal fade" id="stock-modal" tabindex="-1" aria-labelledby="stock-modal-title" aria-hidden="true"><div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h2 class="modal-title fs-5" id="stock-modal-title">Ajustar estoque</h2><button class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button></div><div class="modal-body"><form id="stock-form"><input type="hidden" id="stock-id"><label class="form-label" for="delta">Variação em unidades (negativo para baixa)</label><input class="form-control" id="delta" type="number" required step="1" ><p class="text-secondary mt-2">Exemplo: −2 para consumo de insumo; 10 para entrada de mercadoria.</p><div class="text-end"><button class="btn btn-primary mt-3" type="submit" >Salvar</button></div></form></div></div></div></div></div></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script type="module" src="js/servicos-produtos.js"></script></body></html>
