<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Usuários · InovaMente</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head>
<body><header id="nav"></header><main class="container"><div class=""><p class="eyebrow">InovaMente / seu salão, organizado</p><h1>Usuários</h1><p class="subtitle">Crie acessos para as profissionais do salão.</p><div id="notice" class="d-none" role="alert" aria-live="polite"></div><form id="user-form" class="panel"><div class="row g-3"><div class="col-md-6"><label class="form-label" for="full-name">Nome completo</label><input class="form-control" id="full-name" type="text" required maxlength="150" ></div><div class="col-md-6"><label class="form-label" for="user-email">E-mail</label><input class="form-control" id="user-email" type="email" required autocomplete="off" ></div><div class="col-md-6"><label class="form-label" for="user-password">Senha inicial</label><input class="form-control" id="user-password" type="password" required minlength="8" autocomplete="new-password" ></div><div class="col-md-6"><label class="form-label" for="user-role">Tipo de acesso</label><select class="form-select" id="user-role" required><option value="profissional">Profissional</option><option value="admin">Administrador</option></select></div><div class="col-md-6" id="commission-field"><label class="form-label" for="commission">Comissão (%)</label><input class="form-control" id="commission" type="number" min="0" max="100" step="0.01" value="0" ></div></div><p id="role-help" class="text-secondary mt-3">A comissão é opcional e fica em 0% se não for informada.</p><button class="btn btn-primary mt-3" type="submit" >Criar usuário</button><div id="user-list" class="panel mt-4"></div></form></div></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script type="module" src="js/usuarios.js"></script></body></html>
