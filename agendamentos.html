<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Agenda · InovaMente</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head>
<body><header id="nav"></header><main class="container"><div class=""><p class="eyebrow">InovaMente / seu salão, organizado</p><h1>Agenda</h1><p class="subtitle">Planeje cada atendimento com tranquilidade.</p><div id="notice" class="d-none" role="alert" aria-live="polite"></div><div class="row align-items-end g-3 mb-4"><div class="col-md-4"><label class="form-label" for="day">Data</label><input class="form-control" id="day" type="date" required ></div><div class="col-md-5"><label class="form-label" for="professional-filter">Profissional</label><select class="form-select" id="professional-filter" ></select></div><div class="col-md-3"><button class="btn btn-primary mt-3" type="button" id="new">Novo agendamento</button></div></div><section id="list" class="panel"></section><div class="modal fade" id="appointment-modal" tabindex="-1" aria-labelledby="appointment-modal-title" aria-hidden="true"><div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h2 class="modal-title fs-5" id="appointment-modal-title">Novo agendamento</h2><button class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button></div><div class="modal-body"><form id="appointment-form"><label class="form-label" for="client-id">Cliente</label><select class="form-select" id="client-id" required></select><label class="form-label" for="professional-id">Profissional</label><select class="form-select" id="professional-id" required></select><label class="form-label" for="start">Início</label><input class="form-control" id="start" type="datetime-local" required ><label class="form-label" for="service-ids">Serviços (Ctrl/Cmd para selecionar vários)</label><select class="form-select" id="service-ids" multiple required></select><p id="estimate" class="alert alert-light mt-3"></p><div class="text-end"><button class="btn btn-primary mt-3" type="submit" >Salvar</button></div></form></div></div></div></div><div class="modal fade" id="finish-modal" tabindex="-1" aria-labelledby="finish-modal-title" aria-hidden="true"><div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h2 class="modal-title fs-5" id="finish-modal-title">Concluir atendimento</h2><button class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button></div><div class="modal-body"><form id="finish-form"><input type="hidden" id="finish-id"><p id="finish-summary"></p><p>A confirmação registra a receita, calcula a comissão e conclui o atendimento.</p><div class="text-end"><button class="btn btn-primary mt-3" type="submit" >Salvar</button></div></form></div></div></div></div></div></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script type="module" src="js/agendamentos.js"></script></body></html>
