<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Financeiro · InovaMente</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head>
<body><header id="nav"></header><main class="container"><div class=""><p class="eyebrow">InovaMente / seu salão, organizado</p><h1>Financeiro</h1><p class="subtitle">Clareza para acompanhar os resultados do salão.</p><div id="notice" class="d-none" role="alert" aria-live="polite"></div><ul class="nav nav-tabs" role="tablist"><li class="nav-item" role="presentation"><button class="nav-link active" id="cash-tab" data-bs-toggle="tab" data-bs-target="#cash" type="button" role="tab" aria-controls="cash" aria-selected="true">Caixa</button></li><li class="nav-item" role="presentation"><button class="nav-link " id="sale-tab" data-bs-toggle="tab" data-bs-target="#sale" type="button" role="tab" aria-controls="sale" aria-selected="false">Venda de balcão</button></li><li class="nav-item" role="presentation"><button class="nav-link " id="commissions-tab" data-bs-toggle="tab" data-bs-target="#commissions" type="button" role="tab" aria-controls="commissions" aria-selected="false">Comissões</button></li></ul><div class="tab-content"><section class="tab-pane fade show active" id="cash" role="tabpanel" aria-labelledby="cash-tab"><form id="filter" class="row g-3 align-items-end"><div class="col-md-4"><label class="form-label" for="from">De</label><input class="form-control" id="from" type="date" required ></div><div class="col-md-4"><label class="form-label" for="to">Até</label><input class="form-control" id="to" type="date" required ></div><div class="col-md-4"><button class="btn btn-primary mt-3" type="submit" >Filtrar</button></div></form><p class="mt-4">Saldo no período: <strong id="balance">—</strong></p><div id="cash-list" class="panel"></div><form id="transaction-form" class="panel mt-4"><h2 class="fs-5">Registrar movimentação operacional</h2><label class="form-label" for="type">Tipo</label><select class="form-select" id="type" ><option value="receita">Receita</option><option value="despesa">Despesa</option></select><label class="form-label" for="description">Descrição</label><input class="form-control" id="description" type="text" required ><label class="form-label" for="amount">Valor (R$)</label><input class="form-control" id="amount" type="number" required min="0.01" step="0.01" ><button class="btn btn-primary mt-3" type="submit" >Registrar</button></form></section><section class="tab-pane fade " id="sale" role="tabpanel" aria-labelledby="sale-tab"><form id="sale-form" class="panel"><label class="form-label" for="sale-client">Cliente (opcional)</label><select class="form-select" id="sale-client" ></select><div class="row"><div class="col-md-8"><label class="form-label" for="product">Produto</label><select class="form-select" id="product" ></select></div><div class="col-md-4"><label class="form-label" for="quantity">Quantidade</label><input class="form-control" id="quantity" type="number" min="1" step="1" value="1" ></div></div><button class="btn btn-primary mt-3" type="button" id="add-product">Adicionar produto</button><div id="cart" class="mt-4"></div><p>Total: <strong id="sale-total"></strong></p><button class="btn btn-primary mt-3" type="submit" >Finalizar venda</button></form></section><section class="tab-pane fade " id="commissions" role="tabpanel" aria-labelledby="commissions-tab"><p>Comissões de todos os períodos.</p><div id="commission-list" class="panel"></div></section></div></div></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script type="module" src="js/financeiro.js"></script></body></html>
