<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Clientes · Ateliê Gestão</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head>
<body><header id="nav"></header><main class="container"><div class=""><p class="eyebrow">Ateliê Gestão / seu salão, organizado</p><h1>Clientes</h1><p class="subtitle">Relações que fazem o salão crescer.</p><div id="notice" class="d-none" role="alert" aria-live="polite"></div><div class="d-flex gap-3 align-items-center mb-4"><input id="search" class="form-control" placeholder="Buscar por nome ou telefone" aria-label="Buscar clientes"><button class="btn btn-primary mt-3" type="button" id="new">Nova cliente</button></div><section class="panel" id="list"></section><div class="modal fade" id="client-modal" tabindex="-1" aria-labelledby="client-modal-title" aria-hidden="true"><div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h2 class="modal-title fs-5" id="client-modal-title">Cadastro de cliente</h2><button class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button></div><div class="modal-body"><form id="client-form"><input type="hidden" id="client-id"><label class="form-label" for="name">Nome</label><input class="form-control" id="name" type="text" required maxlength="150" ><label class="form-label" for="phone">Telefone / WhatsApp com DDD</label><input class="form-control" id="phone" type="tel" required maxlength="25" ><label class="form-label" for="birth">Data de nascimento</label><input class="form-control" id="birth" type="date"  ><div class="text-end"><button class="btn btn-primary mt-3" type="submit" >Salvar</button></div></form></div></div></div></div><div class="modal fade" id="history-modal" tabindex="-1" aria-labelledby="history-modal-title" aria-hidden="true"><div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h2 class="modal-title fs-5" id="history-modal-title">Histórico de visitas</h2><button class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button></div><div class="modal-body"><div id="history"></div></div></div></div></div></div></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script type="module" src="js/clientes.js"></script></body></html>
